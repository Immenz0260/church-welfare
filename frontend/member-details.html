<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Details - Church Welfare</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header>
    <div class="logo">
      <span>🏰</span>
      <strong>Church <br>Welfare</strong>
    </div>
    <nav class="navbar">
      <a href="index.html">Record <br>Payment</a>
      <a href="members.html">Members</a>
      <a href="reports.html">Reports</a>
      <div id="themeToggle" class="moon" style="cursor: pointer;">🌙</div>
    </nav>
  </header>

  <main style="max-width:600px; margin:20px auto; padding:0 15px;">
    <a href="members.html" class="back-btn">← Back to Members</a>

    <div class="detailCard">
      <h1 id="detailName">—</h1>
      <p class="since" id="detailSince">Loading…</p>
      <div class="stats">
        <div><small>TOTAL PAID</small><b id="detailTotal">GHS0.00</b></div>
        <div><small>PAYMENTS</small><b id="detailCount">0</b></div>
      </div>
    </div>

    <h3 class="historyTitle">Payment History</h3>
    <div class="historyTable">
      <div class="head"><span>DATE</span><span>AMOUNT</span></div>
      <div id="historyBody"></div>
      <div class="foot"><span>Total</span><span id="historyTotal">GHS0.00</span></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
