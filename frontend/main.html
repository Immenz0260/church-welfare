<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Welfare Web App</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header>
    <div class="logo">
      <span>🏰</span>
      <strong>Church <br>Welfare</strong>
    </div>
    <nav class="navbar">
      <a href="main.html">Record <br>Payment</a>
      <a href="members.html">Members</a>
      <div id="themeToggle" class="moon" style="cursor: pointer;">🌙</div>
    </nav>
  </header>

  <main>
    <h1>Record Dues Payment</h1>
    <p>Enter the member's name and the amount paid. The date is set automatically.</p>

    <div id="messageBox" class="messageBox"></div>

    <div class="form">
      
      <label>Member Name</label>
      <div style="position:relative; width:100%;">
        <input type="text" id="memberName" placeholder="Start typing a name..." autocomplete="off" style="width: 530px;">
        <div id="memberSuggestions"></div>
      </div>
      
      <label>Amount paid</label>
      <input type="number" id="amountPaid" placeholder="0.00">

      <label>Date</label>
      <input type="text" id="paymentDate" readonly>

      <button id="saveBtn">Record Payment</button>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
